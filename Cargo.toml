[workspace]
resolver = "2"
members = ["crates/scqc-core", "crates/scqc-engine"]

[workspace.package]
version = "1.0.1"
authors = ["shouwuhe"]
edition = "2021"
license = "MIT"
repository = "https://github.com/shouwuhe/scqc"

[workspace.dependencies]
sprs = "0.11"
statrs = "0.18"
hnsw_rs = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
flate2 = "1"
thiserror = "2"
anyhow = "1"
rayon = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
sysinfo = "0.33"
sha2 = "0.10"
rand = "0.8"
rand_chacha = "0.3"
minijinja = "2"

# SPEC §16：引擎中不得在可能失败的路径使用 unwrap/expect。
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
lto = "thin"
codegen-units = 4
